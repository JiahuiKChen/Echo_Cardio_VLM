schema_version: 1
policy_id: lvef_multitask_safe_export_v1

authorization:
  status: INSTITUTIONALLY_AUTHORIZED
  recorded_date: '2026-08-05'
  approved_workspace_or_api_class: institutionally_managed_chatgpt_enterprise_edu_healthcare_or_api_organization
  exact_tenant_class_recorded_in_institutional_authority: true
  direct_restricted_inspection_permitted: true
  unrestricted_export_permitted: false

modes:
  APPROVED_DIRECT_RESTRICTED_AGENT:
    enabled: true
    detailed_outputs_must_remain_restricted: true
    ordinary_responses_must_avoid_unnecessary_identifiers: true
    confirmatory_performance_authority_granted: false
    approved_roots:
      - id: restricted_project_mimicecho
        path: /restricted/project/mimicecho
      - id: restricted_projectnb_mimicecho
        path: /restricted/projectnb/mimicecho
    receipt_roots:
      - id: restricted_project_mimicecho
        path: /restricted/project/mimicecho
      - id: restricted_projectnb_mimicecho
        path: /restricted/projectnb/mimicecho

  MANUSCRIPT_OR_GIT_EXPORT:
    enabled: true
    human_approval_required: true
    candidate_hash_binding_required: true
    current_policy_hash_binding_required: true
    schema_profile_required: true
    revalidation_at_release_required: true
    release_receipt_suffix: .release_receipt.json
    restricted_staging_roots:
      - id: restricted_project_mimicecho
        path: /restricted/project/mimicecho
      - id: restricted_projectnb_mimicecho
        path: /restricted/projectnb/mimicecho
    repository_release_roots:
      - docs/lvef_multitask/approved_exports

forbidden_content:
  column_or_key_names:
    - subject_id
    - patient_id
    - person_id
    - study_id
    - dicom_study_id
    - dicom_id
    - sop_instance_uid
    - series_instance_uid
    - study_instance_uid
    - hadm_id
    - stay_id
    - mrn
    - identifier
    - y_true
    - y_pred
    - label
    - prediction
    - pred_lvef
    - pred_reduced_prob
    - embedding
    - embeddings
    - path
    - file_path
    - absolute_path
    - dicom_filepath
    - dicom_abs_path
    - source_dicom_locator
    - extracted_npz_locator
    - keyframe_path
    - npz_path
    - gcs_uri
    - gs_uri
    - raw_name
    - raw_description
    - raw_alias
  value_patterns:
    - '(?i)/restricted/(?:project|projectnb)/'
    - '(?i)gs://'
    - '(?i)(?:^|[/\\])p[0-9]{2}/p[0-9]+/s[0-9]+(?:[/\\]|$)'
    - '(?i)\.dcm(?:$|[/\\\s,])'
    - '(?i)\.(?:npz|npy|parquet|pq|pt|pth|pkl|pickle)(?:$|[/\\\s,])'
  git_blocked_suffixes:
    - .dcm
    - .npz
    - .npy
    - .parquet
    - .pq
    - .pt
    - .pth
    - .pkl
    - .pickle
    - .zip
    - .tar
    - .tar.gz
    - .tgz
    - .jsonl
    - .log
    - .out
    - .err

