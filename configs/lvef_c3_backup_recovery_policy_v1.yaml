forbidden:
  basename_patterns:
    - '(?i)^application_default_credentials[.]json$'
    - '(?i)^(?:access_tokens|credentials)[.]db$'
    - '(?i)^.*(?:service[_-]?account|gcp[_-]?credential|requester[_-]?pays|session).*$'
    - '(?i)^.*(?:preflight|authorization|credential).*[.](?:env|db|sqlite|json)$'
  suffixes:
    - .dcm
    - .dicom
    - .npz
    - .npy
    - .parquet
    - .pq
    - .feather
    - .h5
    - .hdf5
    - .pkl
    - .pickle
    - .log
    - .out
    - .err
  credential_value_patterns:
    - '(?i)\bya29[.][A-Za-z0-9_-]{20,}'
    - '\bAIza[A-Za-z0-9_-]{30,}'
    - '\bGOCSPX-[A-Za-z0-9_-]{20,}'
    - '-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'
    - '(?i)["''](?:refresh_token|access_token|id_token|client_secret|private_key|private_key_id)["'']\s*:\s*["''][^"'']+["'']'
    - '(?i)["''](?:billing_account|billing_account_id|billing_project|quota_project|quota_project_id|project_id|gcp_project|google_cloud_project|client_id|client_email)["'']\s*:\s*["''][^"'']+["'']'
    - '(?im)^\s*(?:export\s+)?(?:LVEF_C3_GCP_BILLING_PROJECT|GOOGLE_CLOUD_PROJECT|GCLOUD_PROJECT|CLOUDSDK_CORE_PROJECT|GCP_PROJECT|BILLING_PROJECT|BILLING_ACCOUNT(?:_ID)?|QUOTA_PROJECT(?:_ID)?)\s*=\s*[^\r\n#]+'
  credentials_and_private_cloud_values_must_be_absent: true
  approved_restricted_control_authorities_only: true
  unapproved_bulk_scientific_payload_must_be_absent: true
  unrestricted_logs_must_be_absent: true

execution_boundary:
  cloud_requests: 0
  object_listing_repeated: false
  scheduler_jobs_submitted: 0
  dicom_bodies_downloaded: 0
  real_dicom_extraction: false
  echoprime_inference: false
  model_fitting: false
  confirmatory_performance_accessed: false
  live_worktree_mutation_permitted: false
  full_c3_authorized: false
