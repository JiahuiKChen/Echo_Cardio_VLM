schema_version: 1
policy_id: lvef_c3_control_authority_backup_recovery_v1
status: IMPLEMENTED_OFFLINE_OWNER_GATED

git:
  required_branch: codex/lvef-multitask-revalidation
  required_origin_remote: origin
  approved_origin_url_regex: '^(?:https://github[.]com/JiahuiKChen/Echo_Cardio_VLM(?:[.]git)?|git@github[.]com:JiahuiKChen/Echo_Cardio_VLM[.]git)$'
  bundle_relative_path: git/lvef_multitask_authority.bundle
  maximum_bundle_bytes: 1000000000
  recovery_documentation_relative_path: docs/lvef_multitask/c3_control_authority_recovery.md

bundle_scan:
  maximum_commits: 10000
  maximum_unique_blobs: 100000
  maximum_total_blob_bytes: 2000000000
  allowed_synthetic_match_patterns:
    - '(?i)(?:synthetic|placeholder|redacted|example[.]invalid|private-project|test-only|not-a-real|not[_-]?set|unknown)'
    - '(?:[$][{]?[A-Za-z_][A-Za-z0-9_]*[}]?|<[A-Z][A-Z0-9_ -]{2,}>)'

roots:
  approved_source_roots:
    - /restricted/project/mimicecho
    - /restricted/projectnb/mimicecho
  approved_backup_root_prefix: /restricted/project/mimicecho/audits
  approved_restore_root_prefix: /restricted/projectnb/mimicecho/audits
  backup_root_must_be_on_backed_tier: true
  restore_root_must_be_isolated_from_live_checkout: true

bounds:
  maximum_declared_items: 64
  maximum_copied_files: 32
  maximum_single_file_bytes: 1000000000
  maximum_total_copied_bytes: 2000000000
  maximum_manifest_bytes: 1048576
  maximum_restore_receipt_bytes: 1048576
  maximum_aggregate_bytes: 65536

classifications:
  allowed:
    - GIT_ORIGIN_PROTECTED
    - COMMITTED_RECONSTRUCTABLE
    - PINNED_EXTERNAL_SOURCE_RECONSTRUCTABLE
    - OWNER_RECREATABLE
    - CHECKSUM_ONLY_NO_COPY_REQUIRED
    - IRREPLACEABLE_BACKUP_REQUIRED
    - EXCLUDED_CREDENTIAL_MATERIAL
    - UNRESOLVED
  copied_classification: IRREPLACEABLE_BACKUP_REQUIRED
  unresolved_classification: UNRESOLVED
  prohibited_from_copy:
    - GIT_ORIGIN_PROTECTED
    - COMMITTED_RECONSTRUCTABLE
    - PINNED_EXTERNAL_SOURCE_RECONSTRUCTABLE
    - OWNER_RECREATABLE
    - CHECKSUM_ONLY_NO_COPY_REQUIRED
    - EXCLUDED_CREDENTIAL_MATERIAL
    - UNRESOLVED

required_declarations:
  git_repository: GIT_ORIGIN_PROTECTED
  tracked_code_and_configuration: COMMITTED_RECONSTRUCTABLE
  echoprime_environment: CHECKSUM_ONLY_NO_COPY_REQUIRED
  cloudsdk_runtime: PINNED_EXTERNAL_SOURCE_RECONSTRUCTABLE
  owner_interactive_authentication: OWNER_RECREATABLE
  cloud_credentials: EXCLUDED_CREDENTIAL_MATERIAL
  requester_pays_private_environment: EXCLUDED_CREDENTIAL_MATERIAL

