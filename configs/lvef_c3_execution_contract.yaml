batching:
  method: sorted_selected_study_authority_contiguous_chunks
  sort_keys: [subject_id_numeric, study_id_numeric]
  studies_per_batch: 250
  batch_prefix: c3_batch_
  keep_study_objects_in_one_batch: true
  maximum_active_extracted_batches: 1

download:
  exact_object_only: true
  prefix_body_copy_permitted: false
  retries: 4
  retry_backoff_seconds: [5, 20, 60, 180]
  resumable: true
  local_size_must_match_remote: true
  local_md5_must_match_remote: true
  local_sha256_required: true

dicom_and_extraction:
  header_audit_before_pixel_decode: true
  cine_candidate_rule: number_of_frames_greater_than_one
  decoder_api: pydicom_3_pixels_pixel_array_raw_true
  decoder_plugin_priority: [pylibjpeg, gdcm, pillow, pyjpegls]
  native_transfer_syntax_uids:
    - 1.2.840.10008.1.2
    - 1.2.840.10008.1.2.1
    - 1.2.840.10008.1.2.1.99
    - 1.2.840.10008.1.2.2
  supported_photometric_interpretations:
    - MONOCHROME1
    - MONOCHROME2
    - RGB
    - YBR_FULL
    - YBR_FULL_422
  required_bits_allocated: 8
  required_bits_stored: 8
  canonical_color_space: RGB
  ybr_conversion: explicit_once_after_raw_decode
  monochrome1_rule: invert_then_replicate_to_rgb
  monochrome2_rule: replicate_to_rgb
  masking_policy: strict_ultrasound_sector_v1
  crop_resize_policy: aspect_center_crop_then_10_percent_zoom_then_cv2_inter_cubic
  opencv_threads: 1
  source_and_sampled_quality_gates:
    - nonempty_sector
    - retained_signal
    - temporal_variation
  target_frames: 32
  target_height: 224
  target_width: 224
  output_dtype: uint8
  temporal_sampling: historical_compatible_linspace_or_tail_repeat_v1
  one_canonical_row_per_physical_clip: true
  unique_physical_source_key_fields:
    - release
    - normalized_source_locator
    - source_generation
    - extracted_clip_index

